<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HumanoidDog — Field Notes</title>
  <style>
    :root {
      --bg: #0E1210;
      --bg-nav: #0B0F0D;
      --bg-card: #151C18;
      --border: #2A3A30;
      --text: #D9E2DA;
      --text-muted: #8FA59A;
      --accent: #7ECBA1;
      --accent-dim: #4A8A6A;
      --hover: #1C2620;
      --active: #1F2E26;
      --code-bg: #111916;
      --scrollbar-thumb: #2A3A30;
      --scrollbar-track: transparent;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-nav);
      flex-shrink: 0;
    }

    .header a {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .header img {
      height: 32px;
      width: auto;
      opacity: 0.9;
    }

    .header-title {
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .header-spacer {
      flex: 1;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
    }

    .theme-toggle:hover {
      border-color: var(--accent-dim);
      color: var(--text);
    }

    /* Main layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Navigation */
    .nav {
      width: 300px;
      min-width: 300px;
      background: var(--bg-nav);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 0;
      flex-shrink: 0;
    }

    .nav::-webkit-scrollbar {
      width: 6px;
    }

    .nav::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }

    .nav::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 3px;
    }

    .nav-category {
      margin-bottom: 4px;
    }

    .nav-category-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      cursor: pointer;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      user-select: none;
      transition: background 0.1s;
    }

    .nav-category-header:hover {
      background: var(--hover);
    }

    .nav-category-header .arrow {
      display: inline-block;
      font-size: 10px;
      transition: transform 0.15s;
      color: var(--text-muted);
      width: 12px;
      text-align: center;
    }

    .nav-category.open > .nav-category-header .arrow {
      transform: rotate(90deg);
    }

    .nav-cheats {
      display: none;
      padding: 2px 0;
    }

    .nav-category.open > .nav-cheats {
      display: block;
    }

    .nav-cheat {
      display: block;
      padding: 6px 16px 6px 34px;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.1s, color 0.1s;
      border-left: 2px solid transparent;
    }

    .nav-cheat:hover {
      background: var(--hover);
      color: var(--text);
    }

    .nav-cheat.active {
      background: var(--active);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    /* Content area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
    }

    .content::-webkit-scrollbar {
      width: 8px;
    }

    .content::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }

    .content::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }

    .content-inner {
      max-width: 800px;
    }

    /* Welcome state */
    .welcome {
      color: var(--text-muted);
      margin-top: 80px;
      text-align: center;
    }

    .welcome h2 {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .welcome p {
      font-size: 13px;
      line-height: 1.7;
    }

    /* Cheat content styles */
    .content-inner h1 {
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--accent);
      margin-bottom: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .content-inner h2 {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text);
      margin: 32px 0 12px;
    }

    .content-inner h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-dim);
      margin: 20px 0 8px;
    }

    .content-inner p {
      margin: 8px 0;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .content-inner ul, .content-inner ol {
      margin: 8px 0;
      padding-left: 24px;
      color: var(--text-muted);
    }

    .content-inner li {
      margin: 4px 0;
      line-height: 1.6;
    }

    .content-inner code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 13px;
      color: var(--accent);
    }

    .content-inner pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
      line-height: 1.5;
    }

    .content-inner pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      color: var(--text);
    }

    .content-inner .comment {
      color: var(--text-muted);
    }

    /* Expandable sub-notes */
    .expandable {
      margin: 16px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .expandable-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--code-bg);
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      color: var(--text-muted);
      transition: background 0.1s, color 0.1s;
    }

    .expandable-header:hover {
      background: var(--hover);
      color: var(--text);
    }

    .expandable-header .exp-arrow {
      font-size: 10px;
      display: inline-block;
      width: 12px;
      text-align: center;
      transition: transform 0.15s;
    }

    .expandable.open > .expandable-header .exp-arrow {
      transform: rotate(90deg);
    }

    .expandable-body {
      display: none;
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    .expandable.open > .expandable-body {
      display: block;
    }

    .content-inner .note-box {
      background: var(--code-bg);
      border-left: 3px solid var(--accent-dim);
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 6px 6px 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .content-inner .note-box strong {
      color: var(--accent);
    }

    .content-inner .step-num {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--bg);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      text-align: center;
      line-height: 22px;
      font-size: 12px;
      font-weight: 700;
      margin-right: 8px;
    }

    /* Mobile nav toggle */
    .mobile-nav-toggle {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: var(--accent-dim);
      color: var(--bg);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .nav-overlay {
      display: none;
    }

    /* Footer */
    .footer {
      display: none;
    }

    @media (max-width: 768px) {
      .nav {
        position: fixed;
        top: 0;
        left: -300px;
        height: 100%;
        z-index: 200;
        transition: left 0.2s;
        padding-top: 60px;
      }

      .nav.mobile-open {
        left: 0;
      }

      .nav-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 199;
      }

      .nav-overlay.visible {
        display: block;
      }

      .mobile-nav-toggle {
        display: block;
      }

      .content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="../index.html">
      <img src="../logo.png" alt="HumanoidDog">
    </a>
    <span class="header-title">Field Notes</span>
    <span class="header-spacer"></span>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">light</button>
  </div>

  <div class="layout">
    <nav class="nav" id="nav">
      <!-- Categories injected by JS -->
    </nav>
    <div class="nav-overlay" id="navOverlay" onclick="closeMobileNav()"></div>

    <main class="content" id="content">
      <div class="content-inner" id="contentInner">
        <div class="welcome">
          <h2>Field Notes</h2>
          <p>Select a cheat from the navigation to get started.</p>
          <p>Workflows, commands, and configurations — all offline, all private.</p>
        </div>
      </div>
    </main>
  </div>

  <button class="mobile-nav-toggle" id="mobileToggle" onclick="toggleMobileNav()">&#9776;</button>

  <script>
    /* ── Category & Cheat Registry ─────────────────────────────
       To add a new category, push an object to CATEGORIES.
       Each cheat needs: id, title, file (path relative to this page).
    ───────────────────────────────────────────────────────────── */
    var CATEGORIES = [
      {
        name: 'AWS Workflows',
        cheats: [
          { id: 'aws-sso-setup',       title: 'Setting Up AWS SSO (Identity Center)', file: 'cheats/aws-sso-setup.html' },
          { id: 'aws-micro-bastion',    title: 'Creating a Micro EC2 Bastion (AL2023)',  file: 'cheats/aws-micro-bastion.html' },
          { id: 'aws-ssm-cheat-sheet',  title: 'SSM Cheat Sheet',                        file: 'cheats/aws-ssm-cheat-sheet.html' }
        ]
      }
      /* ── Future categories ──
      {
        name: 'Linux Workflows',
        cheats: []
      },
      {
        name: 'PC Tuning',
        cheats: []
      },
      {
        name: 'Software Tricks',
        cheats: []
      },
      {
        name: 'HumanoidDog Experiments',
        cheats: []
      }
      */
    ];

    var activeCheatId = null;

    function buildNav() {
      var nav = document.getElementById('nav');
      var html = '';
      for (var i = 0; i < CATEGORIES.length; i++) {
        var cat = CATEGORIES[i];
        html += '<div class="nav-category open" data-cat="' + i + '">';
        html += '<div class="nav-category-header" onclick="toggleCategory(this)">';
        html += '<span class="arrow">&#9654;</span>' + escHtml(cat.name);
        html += '</div>';
        html += '<div class="nav-cheats">';
        for (var j = 0; j < cat.cheats.length; j++) {
          var ch = cat.cheats[j];
          html += '<a class="nav-cheat" data-id="' + ch.id + '" data-file="' + ch.file + '" onclick="loadCheat(this); return false;" href="#">';
          html += escHtml(ch.title);
          html += '</a>';
        }
        html += '</div></div>';
      }
      nav.innerHTML = html;
    }

    function toggleCategory(header) {
      var cat = header.parentElement;
      cat.classList.toggle('open');
    }

    function loadCheat(el) {
      var id = el.getAttribute('data-id');
      var file = el.getAttribute('data-file');

      if (activeCheatId === id) return;

      var all = document.querySelectorAll('.nav-cheat');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('active');
      el.classList.add('active');
      activeCheatId = id;

      var xhr = new XMLHttpRequest();
      xhr.open('GET', file, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          var inner = document.getElementById('contentInner');
          if (xhr.status === 200) {
            inner.innerHTML = xhr.responseText;
            bindExpandables();
          } else {
            inner.innerHTML = '<div class="welcome"><h2>Not Found</h2><p>Could not load cheat: ' + escHtml(file) + '</p></div>';
          }
          document.getElementById('content').scrollTop = 0;
        }
      };
      xhr.send();
      closeMobileNav();
    }

    function bindExpandables() {
      var headers = document.querySelectorAll('.expandable-header');
      for (var i = 0; i < headers.length; i++) {
        headers[i].onclick = function () {
          this.parentElement.classList.toggle('open');
        };
      }
    }

    function escHtml(s) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(s));
      return d.innerHTML;
    }

    /* ── Mobile nav ─────────────────────────────────────────── */
    function toggleMobileNav() {
      document.getElementById('nav').classList.toggle('mobile-open');
      document.getElementById('navOverlay').classList.toggle('visible');
    }

    function closeMobileNav() {
      document.getElementById('nav').classList.remove('mobile-open');
      document.getElementById('navOverlay').classList.remove('visible');
    }

    /* ── Light/dark theme ───────────────────────────────────── */
    var lightVars = {
      '--bg': '#F4F4F0',
      '--bg-nav': '#EAEAE4',
      '--bg-card': '#FFFFFF',
      '--border': '#D0D0C8',
      '--text': '#1A1A1A',
      '--text-muted': '#5A5A52',
      '--accent': '#2D7A50',
      '--accent-dim': '#3A9966',
      '--hover': '#E0E0D8',
      '--active': '#D8D8D0',
      '--code-bg': '#F0F0EA',
      '--scrollbar-thumb': '#C0C0B8'
    };

    var darkVars = {
      '--bg': '#0E1210',
      '--bg-nav': '#0B0F0D',
      '--bg-card': '#151C18',
      '--border': '#2A3A30',
      '--text': '#D9E2DA',
      '--text-muted': '#8FA59A',
      '--accent': '#7ECBA1',
      '--accent-dim': '#4A8A6A',
      '--hover': '#1C2620',
      '--active': '#1F2E26',
      '--code-bg': '#111916',
      '--scrollbar-thumb': '#2A3A30'
    };

    var isDark = true;

    function toggleTheme() {
      isDark = !isDark;
      var vars = isDark ? darkVars : lightVars;
      var root = document.documentElement;
      for (var key in vars) {
        root.style.setProperty(key, vars[key]);
      }
      document.querySelector('.theme-toggle').textContent = isDark ? 'light' : 'dark';
    }

    /* ── Init ───────────────────────────────────────────────── */
    buildNav();
  </script>
</body>
</html>
